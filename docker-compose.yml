version: '3.8'

services:
  # Vector database for RAG
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_ALLOW_CORS=true
    # healthcheck:  # Temporarily commented out for local development troubleshooting
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 60s
    networks:
      - app_network

  # Redis for caching
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

  # OCR Service
  ocr_service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HF_TOKEN=${HF_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis
    command: uvicorn src.ocr.service:app --host 0.0.0.0 --port 8001
    networks:
      - app_network

  # RAG Service
  rag_service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HF_TOKEN=${HF_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - qdrant
      - redis
    command: uvicorn src.rag.service:app --host 0.0.0.0 --port 8000
    networks:
      - app_network

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OCR_SERVICE_URL=http://ocr_service:8001
      - RAG_SERVICE_URL=http://rag_service:8000
    depends_on:
      - ocr_service
      - rag_service
    command: uvicorn src.frontend.app:app --host 0.0.0.0 --port 8080
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  qdrant_data:
  redis_data: 