    <text x="26" y="70" fill="#EDF4FF" font-size="26" font-family="Manrope, Arial, sans-serif" font-weight="700">Policy summaries</text>
  </g>

  <g transform="translate(426 310)">
    <rect x="0" y="0" width="264" height="110" rx="26" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="26" y="40" fill="#8DF2C5" font-size="18" font-family="Manrope, Arial, sans-serif" font-weight="800" letter-spacing="1.8">ASK</text>
