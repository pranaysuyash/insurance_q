    <path d="M24 22L58 22L64 28L64 60L46 64L24 56V22Z" stroke="#08111F" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M35 40L43 48L56 34" stroke="#08111F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

