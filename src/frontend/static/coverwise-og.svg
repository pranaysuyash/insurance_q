<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CoverWise</title>
  <desc id="desc">Insurance policy companion that turns policy PDFs into plain-language answers.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="72" x2="1106" y2="564" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="1" stop-color="#0F1E35"/>
    </linearGradient>
    <linearGradient id="glow" x1="168" y1="88" x2="1068" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DD8FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8DF2C5" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="card" x1="320" y1="170" x2="892" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B30"/>
      <stop offset="1" stop-color="#0A1425"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="56" fill="url(#bg)"/>
  <circle cx="230" cy="130" r="170" fill="#8DD8FF" fill-opacity="0.12"/>
  <circle cx="1036" cy="110" r="140" fill="#8DF2C5" fill-opacity="0.12"/>
  <circle cx="998" cy="518" r="190" fill="#FFD27D" fill-opacity="0.08"/>
  <rect x="86" y="78" width="1028" height="474" rx="40" fill="url(#glow)" fill-opacity="0.18" stroke="rgba(255,255,255,0.08)"/>
  <rect x="90" y="82" width="1020" height="466" rx="36" fill="url(#card)" stroke="rgba(255,255,255,0.08)"/>

  <g transform="translate(144 150)">
