<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="legal-document-sha256" content="{{ legal_document_sha256 }}">
    <title>{{ page_title }} | {{ site_name }}</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #f5f7f7; color: #142320; }
      main { box-sizing: border-box; max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
      a { color: #096b5c; }
      .back { display: inline-block; margin-bottom: 28px; }
      .document { background: #fff; border: 1px solid #dce5e2; border-radius: 16px; padding: clamp(20px, 5vw, 48px); box-shadow: 0 10px 32px rgba(17, 50, 44, .08); }
      h1 { margin-top: 0; }
      pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 400 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .provenance { margin-top: 20px; color: #4c605b; font-size: 13px; }
      @media (prefers-color-scheme: dark) {
        body { background: #111b19; color: #e9f2ef; }
        .document { background: #172522; border-color: #2f4a44; box-shadow: none; }
        a { color: #7de0c8; }
        .provenance { color: #b7cbc5; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/">Back to {{ site_name }}</a>
      <article class="document" aria-labelledby="legal-title">
        <h1 id="legal-title">{{ page_title }}</h1>
        <pre>{{ legal_document }}</pre>
      </article>
      <p class="provenance">Canonical source SHA-256: {{ legal_document_sha256 }}</p>
    </main>
  </body>
</html>
