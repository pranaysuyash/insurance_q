<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Policy Parser & QA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        .loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">Insurance Policy Parser & QA</h1>
            <p class="text-gray-600">Upload your insurance policy documents and ask questions about them</p>
        </div>
        
        <!-- Main Content -->
        <div class="grid grid-cols-1 gap-8">
            <!-- Document Upload Section -->
            <div class="bg-white rounded-xl shadow-lg p-6 transition-all hover:shadow-xl">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">Upload Document</h2>
                <div class="mb-6">
                    <div class="flex items-center justify-center w-full">
                        <label class="flex flex-col items-center justify-center w-full h-48 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                </svg>
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                                <p class="text-xs text-gray-500">PDF, JPG, PNG, or TIFF</p>
                            </div>
                            <input id="documentInput" type="file" class="hidden" accept=".pdf,.jpg,.jpeg,.png,.tiff"/>
                        </label>
                    </div>
                </div>
                <div class="flex justify-center">
                    <button onclick="uploadDocument()" 
                            class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors flex items-center space-x-2">
                        <span>Process Document</span>
                        <span id="uploadSpinner" class="hidden">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </span>
                    </button>
                </div>
                <div id="uploadStatus" class="mt-4 text-sm text-center"></div>
            </div>

            <!-- OCR Results Section -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">OCR Results</h2>
                <div id="ocrResults" class="prose max-w-none">
                    <p class="text-gray-500 text-center">No document processed yet</p>
                </div>
            </div>

            <!-- Query Section -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">Ask Questions</h2>
                <div class="mb-4">
                    <textarea id="queryInput"
                             placeholder="Ask a question about the insurance policy..."
                             class="w-full p-3 border rounded-lg resize-none h-32 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div class="flex justify-center">
                    <button onclick="submitQuery()"
                            class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition-colors flex items-center space-x-2">
                        <span>Submit Question</span>
                        <span id="querySpinner" class="hidden">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </span>
                    </button>
                </div>
                <div id="queryResults" class="mt-6">
                    <p class="text-gray-500 text-center">No questions asked yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const OCR_API_URL = 'http://localhost:8001';
        const RAG_API_URL = 'http://localhost:8000';
        let currentDocumentId = null;

        function showError(containerId, message) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded fade-in">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-red-700">${message}</p>
                        </div>
                    </div>
                </div>`;
        }

        function showSuccess(containerId, message) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded fade-in">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-green-700">${message}</p>
                        </div>
                    </div>
                </div>`;
        }

        async function uploadDocument() {
            const fileInput = document.getElementById('documentInput');
            const statusDiv = document.getElementById('uploadStatus');
            const spinner = document.getElementById('uploadSpinner');
            const resultsDiv = document.getElementById('ocrResults');

            if (!fileInput.files.length) {
                showError('uploadStatus', 'Please select a file');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            try {
                spinner.classList.remove('hidden');
                statusDiv.innerHTML = '<p class="text-blue-500">Processing document...</p>';
                
                // Process with OCR
                const ocrResponse = await fetch(`${OCR_API_URL}/process`, {
                    method: 'POST',
                    body: formData
                });
                
                const ocrResult = await ocrResponse.json();
                
                if (ocrResult.status === 'error') {
                    throw new Error(ocrResult.error);
                }

                // Display OCR results
                resultsDiv.innerHTML = `
                    <div class="space-y-6 fade-in">
                        <div class="bg-blue-50 rounded-lg p-4">
                            <h3 class="font-semibold text-blue-900">Document Information</h3>
                            <div class="mt-2 grid grid-cols-2 gap-4">
                                <div>
                                    <p class="text-sm text-blue-700">Pages</p>
                                    <p class="font-medium">${ocrResult.metadata.page_count}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-blue-700">Confidence</p>
                                    <p class="font-medium">${(ocrResult.metadata.confidence * 100).toFixed(1)}%</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 rounded-lg p-4">
                            <h3 class="font-semibold text-gray-900">Extracted Text</h3>
                            <pre class="mt-2 whitespace-pre-wrap text-sm text-gray-700 bg-white p-4 rounded border">${ocrResult.result.document_text}</pre>
                        </div>

                        ${ocrResult.result.tables.length ? `
                            <div class="bg-green-50 rounded-lg p-4">
                                <h3 class="font-semibold text-green-900">Tables Found</h3>
                                <p class="mt-2 text-green-700">${ocrResult.result.tables.length} tables extracted</p>
                            </div>
                        ` : ''}
                    </div>
                `;

                // Store document text for RAG
                currentDocumentId = await processForRAG(ocrResult.result.document_text);
                
                showSuccess('uploadStatus', 'Document processed successfully!');
            } catch (error) {
                showError('uploadStatus', `Error: ${error.message}`);
            } finally {
                spinner.classList.add('hidden');
            }
        }

        async function processForRAG(text) {
            try {
                const response = await fetch(`${RAG_API_URL}/process`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        metadata: {
                            source: 'ocr_upload',
                            timestamp: new Date().toISOString()
                        }
                    })
                });

                const result = await response.json();
                return result.document_id;
            } catch (error) {
                console.error('Error processing for RAG:', error);
                throw error;
            }
        }

        async function submitQuery() {
            const queryInput = document.getElementById('queryInput');
            const resultsDiv = document.getElementById('queryResults');
            const spinner = document.getElementById('querySpinner');
            
            if (!queryInput.value.trim()) {
                showError('queryResults', 'Please enter a question');
                return;
            }

            if (!currentDocumentId) {
                showError('queryResults', 'Please process a document first');
                return;
            }

            try {
                spinner.classList.remove('hidden');
                resultsDiv.innerHTML = '<p class="text-blue-500 text-center">Processing query...</p>';

                const response = await fetch(`${RAG_API_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: queryInput.value,
                        filters: {
                            doc_id: currentDocumentId
                        }
                    })
                });

                const result = await response.json();

                if (result.status === 'error') {
                    throw new Error(result.error);
                }

                resultsDiv.innerHTML = `
                    <div class="space-y-6 fade-in">
                        <div class="bg-blue-50 rounded-lg p-4">
                            <p class="font-semibold text-blue-900">Answer:</p>
                            <p class="mt-2 text-gray-700">${result.answer}</p>
                        </div>
                        
                        <div class="bg-gray-50 rounded-lg p-4">
                            <p class="font-semibold text-gray-900">Sources:</p>
                            <ul class="mt-2 space-y-3">
                                ${result.sources.map(source => `
                                    <li class="bg-white p-3 rounded border">
                                        <p class="text-sm text-gray-700">${source.text}</p>
                                        <p class="text-xs text-gray-500 mt-1">Confidence: ${(source.score * 100).toFixed(1)}%</p>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            } catch (error) {
                showError('queryResults', `Error: ${error.message}`);
            } finally {
                spinner.classList.add('hidden');
            }
        }

        // Add drag and drop functionality
        const dropZone = document.querySelector('label');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('bg-blue-50');
            dropZone.classList.remove('bg-gray-50');
        }

        function unhighlight(e) {
            dropZone.classList.remove('bg-blue-50');
            dropZone.classList.add('bg-gray-50');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            document.getElementById('documentInput').files = files;
        }
    </script>
</body>
</html>
