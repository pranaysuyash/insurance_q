<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12304F"/>
      <stop offset="1" stop-color="#071B33"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69A8FF"/>
      <stop offset="1" stop-color="#2F80ED"/>
    </linearGradient>
  </defs>
  <!-- Platform launchers apply their own mask. Keep the source full-bleed so
       iOS never fills transparent corners white and web maskable icons retain
       safe background coverage at every crop shape. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="326" fill="#FFFFFF" opacity="0.055"/>
  <path d="M512 184 C632 242 724 260 794 286 L794 494 C794 674 680 802 512 864 C344 802 230 674 230 494 L230 286 C300 260 392 242 512 184 Z"
        fill="url(#shield)"/>
  <path d="M365 520 L470 628 L674 402"
        fill="none" stroke="#5EEAD4" stroke-width="74"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
