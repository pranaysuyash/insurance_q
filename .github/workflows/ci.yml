name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.7.8"
        
    - name: Install Python dependencies
      run: |
        uv venv --python ${{ matrix.python-version }} .venv
        uv pip install --python .venv/bin/python -r requirements-local.txt
        
    - name: Run tests
      run: tools/run_backend_tests.sh tests/ --cov=src --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.7.8"

    - name: Install static-safety checker
      run: |
        uv tool install ruff==0.12.0

    - name: Compile Python sources
      run: |
        python -m compileall -q src tests

    - name: Run critical static-safety checks
      run: |
        ruff check --select E9,F821 src tests

  supply-chain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.7.8"

    - name: Install local audit tooling
      run: |
        uv venv --python 3.11 .venv
        uv pip install --python .venv/bin/python -r requirements-local.txt

    - name: Audit declared production dependencies
      run: |
        .venv/bin/pip-audit -r requirements.txt --disable-pip --no-deps

    - name: Verify Linux OCR lock is current
      run: |
        lock_check=$(mktemp)
        uv pip compile requirements-production-ocr.txt \
          --generate-hashes \
          --python-platform x86_64-manylinux_2_17 \
          --torch-backend cpu \
          --output-file "$lock_check"
        sed '1,2d' requirements-production-ocr-linux-x86_64.lock > "$lock_check.expected"
        sed '1,2d' "$lock_check" > "$lock_check.actual"
        cmp --silent "$lock_check.expected" "$lock_check.actual"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.2'
        channel: stable
        cache: true

    - name: Install Flutter dependencies
      working-directory: mobile
      run: flutter pub get

    - name: Analyze Flutter code
      working-directory: mobile
      run: flutter analyze --no-fatal-infos

    - name: Run Flutter tests
      working-directory: mobile
      run: flutter test --concurrency=1

    - name: Compile non-distributable CI release artifact
      working-directory: mobile
      run: |
        flutter build apk --release --analyze-size \
          --dart-define=ENVIRONMENT=ci \
          --dart-define=BOOTSTRAP_POLICY_DEMO=false
        echo "apk_size=$(stat --format=%s build/app/outputs/flutter-apk/app-release.apk)" >> $GITHUB_OUTPUT
      id: build_apk

    - name: Check APK size budget
      working-directory: mobile
      run: bash tools/check_apk_size.sh 60

    - name: Upload size analysis artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-size-analysis
        path: mobile/build/app/outputs/flutter-apk/*.json.treemap
        retention-days: 30
        if-no-files-found: ignore

  docker:
    needs: [test, lint, supply-chain, mobile]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/insurance_app:${{ github.sha }}
